name: Build CrashTool

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write # Needed to attach CrashTool.exe to GitHub Releases on version tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Run bootstrap build script
        run: |
          chmod +x *.sh
          ./*.sh

      - name: Verify CrashTool.exe exists
        run: ls -lh CrashTool.exe

      - name: Upload CrashTool.exe build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashTool-windows-amd64
          path: CrashTool.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CrashTool.exe
          generate_release_notes: true
